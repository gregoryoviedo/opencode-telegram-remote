version: 2

updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "go"
    groups:
      # Major version bumps are noisy — keep them separate for review
      major:
        dependency-type: "direct"
        update-types:
          - "major"
    commit-message:
      prefix: "chore(deps)"
    # Avoid forcing PRs for every indirect dep
    ignore:
      - dependency-name: "*"
        versions:
          - ">= 2"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(actions)"

  # macOS Swift app
  - package-ecosystem: "swift"
    directory: "/macos"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "macos"
    commit-message:
      prefix: "chore(macos-deps)"
